<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layercake</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: grid; place-items: center; }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      perspective: 1000px;
      perspective-origin: 50% 50%;
    }

    .scene {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: kenburns 14s ease-in-out infinite alternate;
      will-change: transform;
    }

    .scene .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      transform-origin: 50% 50%;
    }

    /* Push each layer back in Z; scale up by (P + |Z|) / P so it still fills the frame.
       Parallax then falls out of the perspective projection automatically. */
    .scene .l-bg     { transform: translateZ(-500px) scale(1.5); z-index: 1; }
    .scene .l-tower  { transform: translateZ(-200px) scale(1.2); z-index: 2; }
    .scene .l-marsha { transform: translateZ(0)               scale(1);   z-index: 3; }

    .hero-wordmark {
      position: absolute;
      inset: 0;
      z-index: 4;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 9vw, 8rem);
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    @keyframes kenburns {
      from { transform: translate3d(-2%, -1%, 0)   scale(1.00); }
      to   { transform: translate3d( 14%,  14%, 120px) scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene { animation: none; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="scene">
      <img src="bg.png"     class="layer l-bg"     alt="">
      <img src="tower.png"  class="layer l-tower"  alt="">
      <img src="marsha.png" class="layer l-marsha" alt="">
    </div>
    <h1 class="hero-wordmark"></h1>
  </div>
</body>
</html>
